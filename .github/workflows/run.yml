name: Ejecutar eventos diarios

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 08:00 Madrid (CET/CEST)
  workflow_dispatch: {}    # Permite ejecutarlo a mano

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install deps
        run: npm install node-fetch nodemailer

      - name: Run script
        run: node events.js
        env:
          MEETUP_TOKEN: ${{ secrets.MEETUP_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
``
